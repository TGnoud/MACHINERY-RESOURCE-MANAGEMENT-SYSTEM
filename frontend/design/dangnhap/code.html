<body class="bg-background text-on-background h-screen w-full flex overflow-hidden">
<!-- AuthLayout: Left Panel (Branding & Illustration) -->
<div class="hidden lg:flex w-1/2 relative bg-surface-container-high border-r border-border overflow-hidden flex-col justify-between">
<!-- Background Image/Illustration -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center z-0" data-alt="A highly detailed and atmospheric photograph of a modern industrial manufacturing facility. The scene is illuminated by cool, high-tech cyan and stark white lighting, casting dynamic shadows over massive, precise robotic arms and gleaming metal machinery. The visual style is crisp, organized, and emphasizes a blend of heavy engineering and advanced software control, matching a professional corporate aesthetic. The mood conveys reliability, intelligence, and large-scale operational efficiency." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDib15EUfvML0MGYwYQ4vDqdqHFiiH2cQxMEh6GyO9nDbFDEI4ES8A66AW5KvUicaJ0gABVabnHk3gyflKhbGAqQ5qZoJPzZHeCAUBxokVQZ886XUSardydmwAR70B_jXKzxPmv7NpcAAs_vjvOMBTIXyb80T7eydA63bMelSL_GE88PkldgxO5NzdUsBAmh4G0WJcroYs6lQWDU9emuB9Hf7N3qdFa8oxCp1uu6QNYoV_Xu9jZ8x2lSEKMYSAOknLBvAb6LSuC57I');">
<!-- Overlay to ensure text readability -->
<div class="absolute inset-0 bg-on-primary-fixed/80 backdrop-blur-sm z-10"></div>
</div>
<!-- Content Overlay -->
<div class="relative z-20 flex flex-col h-full justify-between p-xl">
<!-- Brand -->
<div class="mt-lg">
<h1 class="font-display-lg text-display-lg text-primary-fixed font-bold tracking-tight">GnoudCRM</h1>
<p class="font-headline-sm text-headline-sm text-surface-container mt-sm max-w-[80%] font-medium leading-relaxed">
                    Hệ thống quản lý thiết bị, điều phối và bảo trì máy móc
                </p>
</div>
<!-- Visual Graphic / decorative element -->
<div class="mb-lg">
<div class="w-24 h-1 bg-primary rounded-full mb-md opacity-80"></div>
<div class="flex items-center gap-sm text-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[20px]" data-icon="precision_manufacturing">precision_manufacturing</span>
<span>Industrial Intelligence</span>
</div>
</div>
</div>
</div>
<!-- AuthLayout: Right Panel (Login Form) -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-lowest">
<!-- Mobile Logo (hidden on desktop) -->
<div class="absolute top-margin-mobile left-margin-mobile lg:hidden">
<h1 class="font-headline-md text-headline-md text-primary font-bold">GnoudCRM</h1>
</div>
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface rounded-xl border border-border shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.1)] p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col gap-xs text-center lg:text-left">
<h2 class="font-display-lg-mobile text-display-lg-mobile lg:font-display-lg lg:text-display-lg font-bold text-on-surface">Đăng nhập</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Truy cập vào hệ thống điều phối của bạn.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full px-md py-sm bg-surface border border-border rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" id="email" placeholder="ví dụ: admin@gnoudcrm.vn" type="email">
</div>
<!-- Password Field (with validation error example) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative w-full">
<input class="w-full pl-md pr-xl py-sm bg-surface border border-error rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-error focus:ring-2 focus:ring-error/20 transition-all" id="password" type="password" value="invalidpass">
<button class="absolute right-sm top-1/2 -translate-y-1/2 p-sm text-outline-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off" id="toggle-icon">visibility_off</span>
</button>
</div>
<!-- Validation Error Message -->
<p class="font-body-sm text-body-sm text-error flex items-center gap-xs mt-1">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
                        Mật khẩu không chính xác hoặc tài khoản đã bị khóa.
                    </p>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-4 h-4 rounded border-border text-primary focus:ring-primary/20 focus:ring-offset-0 bg-surface checked:bg-primary transition-colors cursor-pointer" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container hover:underline transition-all" href="#">Quên mật khẩu?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md font-semibold py-md px-lg rounded-lg shadow-sm hover:shadow-md transition-all mt-sm flex justify-center items-center gap-sm" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[20px]" data-icon="login">login</span>
</button>
</form>
<!-- Register Link -->
<div class="text-center mt-sm pt-lg border-t border-border">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Chưa có tài khoản? <a class="font-label-md text-label-md text-primary hover:underline font-semibold ml-xs" href="#">Đăng ký</a>
</p>
</div>
</div>
</div>
<!-- Script for password toggle interaction -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
                toggleIcon.setAttribute('data-icon', 'visibility');
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
                toggleIcon.setAttribute('data-icon', 'visibility_off');
            }
        }
    </script>
